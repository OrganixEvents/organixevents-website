# OrganixEvents — Netlify configuration
# No npm install needed: the build is a zero-dependency Node script.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Production: indexable, canonical domain https://organixevents.com (defaults in scripts/build.mjs).

[context.production.environment]
  SITE_URL = "https://organixevents.com"
  SITE_INDEXABLE = "true"

# Deploy previews and branch deploys stay out of search engines.
[context.deploy-preview.environment]
  SITE_INDEXABLE = "false"
[context.branch-deploy.environment]
  SITE_INDEXABLE = "false"
